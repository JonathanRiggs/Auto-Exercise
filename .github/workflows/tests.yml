name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          {dotnet-version: 10.0.x }
      - run: dotnet build
      - run: pwsh tests/AutoExercise.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test --no-build --settings tests/AutoExercise.Tests/.runsettings --logger trx